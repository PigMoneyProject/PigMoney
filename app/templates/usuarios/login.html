{% extends 'base.html' %}

{% block title %}PigMoney — Login{% endblock %}

{% block content %}

    <h1 class="page-title">Entrar</h1>
    <p class="page-description">Acesse sua conta para gerenciar suas financas.</p>

    {% if form.errors %}
        <div class="alert alert-error">
            Usuario ou senha invalidos. Tente novamente.
        </div>
    {% endif %}

    <div class="form-card">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Usuario</label>
                <input type="text" name="username" id="id_username" class="form-control" required autofocus>
            </div>
            <div class="form-group">
                <label for="id_password">Senha</label>
                <input type="password" name="password" id="id_password" class="form-control" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Entrar</button>
                <a href="{% url 'cadastro' %}" class="btn btn-secondary">Cadastre-se</a>
            </div>
        </form>
    </div>

{% endblock %}
